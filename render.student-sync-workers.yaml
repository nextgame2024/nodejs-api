# OPTIONAL: one paid worker replaces the separate invoice/user workers and the
# document cron. Do not apply until the cutover checklist is complete.
services:
  - type: worker
    name: sophia-student-sync-worker
    region: singapore
    runtime: docker
    dockerfilePath: ./Dockerfile.student-sync
    dockerContext: .
    dockerCommand: node scripts/process-student-sync.mjs
    envVars:
      - key: XERO_SYNC_EXECUTION_MODE
        value: worker
      - key: STUDENT_USER_SYNC_EXECUTION_MODE
        value: worker
      - key: STUDENT_SYNC_PIPELINE_ENABLED
        value: "true"
      - key: XERO_SYNC_SCHEDULER_ENABLED
        value: "false"
      # Apply 082 and deploy Runtime API + shared worker before enabling both.
      - key: XERO_SHARED_BACKOFF_ENABLED
        value: "false"
      # Apply 083 before enabling on Runtime API and this worker.
      - key: STUDENT_DOCUMENT_SOURCE_DEDUP_ENABLED
        value: "false"
      # Apply 084 first; requires shared backoff and source dedup on both services.
      - key: XERO_SHARED_QUOTA_ENABLED
        value: "false"
      # Worker only: apply 085 and enable quota/backoff/source dedup first.
      - key: STUDENT_DOCUMENT_RECHECKS_ENABLED
        value: "false"
      - key: STUDENT_SYNC_HEALTH_LOGS_ENABLED
        value: "false"
      # Apply 094/095 and configure an approved vision model + OPENAI_API_KEY
      # before enabling on Runtime API and worker. Analysis runs throughout the day.
      - key: STUDENT_DOCUMENT_ANALYSIS_ENABLED
        value: "false"
      # Worker only: retain 30 until rollout approval. 30-120; above 30 requires
      # quota/backoff/source dedup true. The 500-source cap and window stay fixed.
      - key: STUDENT_DOCUMENT_FETCH_BUDGET_MINUTES
        value: "30"
      - key: SOPHIA_RUNTIME_DB_POOL_SIZE
        value: "2"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_SSL
        value: "true"
      - key: STUDENT_SYNC_DOCUMENT_CUSTOMER_IDS
        sync: false
      - key: SOPHIA_RUNTIME_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
      - key: XERO_RETURN_URL
        sync: false
      - key: XERO_OAUTH_STATE_SECRET
        sync: false
      - key: XERO_TOKEN_ENCRYPTION_KEY
        sync: false
