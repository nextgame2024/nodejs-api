# OPTIONAL: one paid worker replaces the separate invoice/user workers and the
# document cron. Do not apply until the cutover checklist is complete.
services:
  - type: worker
    name: sophia-student-sync-worker
    region: singapore
    runtime: docker
    dockerfilePath: ./Dockerfile.student-sync
    dockerContext: .
    dockerCommand: node scripts/process-student-sync.mjs
    envVars:
      - key: XERO_SYNC_EXECUTION_MODE
        value: worker
      - key: STUDENT_USER_SYNC_EXECUTION_MODE
        value: worker
      - key: STUDENT_SYNC_PIPELINE_ENABLED
        value: "true"
      - key: XERO_SYNC_SCHEDULER_ENABLED
        value: "false"
      # Apply 082 and deploy Runtime API + shared worker before enabling both.
      - key: XERO_SHARED_BACKOFF_ENABLED
        value: "false"
      - key: SOPHIA_RUNTIME_DB_POOL_SIZE
        value: "2"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_SSL
        value: "true"
      - key: STUDENT_SYNC_DOCUMENT_CUSTOMER_IDS
        sync: false
      - key: SOPHIA_RUNTIME_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
      - key: XERO_RETURN_URL
        sync: false
      - key: XERO_OAUTH_STATE_SECRET
        sync: false
      - key: XERO_TOKEN_ENCRYPTION_KEY
        sync: false
